    <script>
      window.xrMode = 'immersive-vr';
      function setXRMode(mode) {
        const btnVR = document.getElementById('btn-vr');
        const btnAR = document.getElementById('btn-ar');
        const label = document.getElementById('mode-label');
        if (mode === 'ar') {
          window.xrMode = 'immersive-ar';
          btnAR.classList.add('active');
          btnVR.classList.remove('active');
          label.textContent = 'Passthrough — see your room';
        } else {
          window.xrMode = 'immersive-vr';
          btnVR.classList.add('active');
          btnAR.classList.remove('active');
          label.textContent = 'Fully immersive';
        }
      }

      // Intercept XR session requests to use the selected mode
      if (navigator.xr) {
        const _origRequestSession = navigator.xr.requestSession.bind(navigator.xr);
        navigator.xr.requestSession = function(mode, options) {
          const useMode = (mode === 'immersive-vr' || mode === 'immersive-ar') ? window.xrMode : mode;
          console.log('[XR] Requesting session:', useMode);
          return _origRequestSession(useMode, options);
        };
      }

    <script type="module">
import 'xrblocks/addons/simulator/SimulatorAddons.js';
import * as THREE from 'three';
import * as xb from 'xrblocks';
import { Text } from 'troika-three-text';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

// ==========================================
// PROCEDURAL AUDIO SYNTHESIZER
// ==========================================
let audioCtx = null;
let thwackBuffer, twangBuffer, bounceBuffer, spookBuffer, leafBuffer, nockBuffer, creakBuffer;

// Settings-controlled global state
let masterVolume = 0.7;
let muted = false;
let hapticsEnabled = true;

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const sr = audioCtx.sampleRate;
  thwackBuffer = audioCtx.createBuffer(1, sr * 0.2, sr);
  for(let i=0; i<sr*0.2; i++) thwackBuffer.getChannelData(0)[i] = (Math.random()*2-1) * Math.exp(-25 * (i/sr)) * 0.8;
  bounceBuffer = audioCtx.createBuffer(1, sr * 0.3, sr);
  for(let i=0; i<sr*0.3; i++) bounceBuffer.getChannelData(0)[i] = Math.sin(2 * Math.PI * 800 * (i/sr)) * Math.exp(-20 * (i/sr)) * 0.5 + (Math.random()*2-1) * Math.exp(-30 * (i/sr)) * 0.3;
  twangBuffer = audioCtx.createBuffer(1, sr * 0.4, sr);
  for(let i=0; i<sr*0.4; i++) twangBuffer.getChannelData(0)[i] = Math.sin(2 * Math.PI * (100 + Math.exp(-10 * (i/sr)) * 50) * (i/sr)) * Math.exp(-12 * (i/sr));
  leafBuffer = audioCtx.createBuffer(1, sr * 0.15, sr);
  for(let i=0; i<sr*0.15; i++) leafBuffer.getChannelData(0)[i] = (Math.random()*2-1) * Math.exp(-15 * (i/sr)) * 0.4;
  spookBuffer = audioCtx.createBuffer(1, sr * 0.4, sr);
  for(let i=0; i<sr*0.4; i++) spookBuffer.getChannelData(0)[i] = Math.sin(2 * Math.PI * 300 * (i/sr)) * Math.exp(-10 * (i/sr)) * 0.6;

  // [FIX #12] Nock click sound — short percussive tap
  nockBuffer = audioCtx.createBuffer(1, sr * 0.05, sr);
  for(let i=0; i<sr*0.05; i++) nockBuffer.getChannelData(0)[i] = Math.sin(2 * Math.PI * 2000 * (i/sr)) * Math.exp(-60 * (i/sr)) * 0.4;

  // [FIX #11] Creak sound for fatigue warning
  creakBuffer = audioCtx.createBuffer(1, sr * 0.3, sr);
  for(let i=0; i<sr*0.3; i++) {
    const t = i/sr;
    creakBuffer.getChannelData(0)[i] = Math.sin(2 * Math.PI * (80 + Math.sin(t * 40) * 30) * t) * Math.exp(-8 * t) * 0.3;
  }
}

function playSound(buffer, volume = 0.5) {
  if (!audioCtx || !buffer || muted) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const source = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();
  source.buffer = buffer;
  gain.gain.value = volume * masterVolume;
  source.connect(gain);
  gain.connect(audioCtx.destination);
  source.start(0);
}

function pulseHaptic(controller, intensity = 0.5, durationMs = 50) {
  if (!hapticsEnabled) return;
  if (controller && controller.xrInputSource && controller.xrInputSource.gamepad) {
    const hapticActuator = controller.xrInputSource.gamepad.hapticActuators?.[0];
    if (hapticActuator && hapticActuator.pulse) hapticActuator.pulse(intensity, durationMs);
  }
}

// ==========================================
// ARROW OBJECT POOL [FIX #3, #7]
// ==========================================
class ArrowPool {
  constructor(scene, shaftGeo, tipGeo, shaftMat, tipMat, poolSize = 20) {
    this.scene = scene;
    this.pool = [];
    this.active = [];

    for (let i = 0; i < poolSize; i++) {
      const group = this._createArrowGroup(shaftGeo, tipGeo, shaftMat, tipMat);
      group.visible = false;
      scene.add(group);
      this.pool.push(group);
    }
  }

  _createArrowGroup(shaftGeo, tipGeo, shaftMat, tipMat) {
    const group = new THREE.Group();
    const shaft = new THREE.Mesh(shaftGeo, shaftMat);
    shaft.position.z = 0.4; shaft.rotation.x = Math.PI / 2;
    group.add(shaft);
    const tip = new THREE.Mesh(tipGeo, tipMat);
    tip.position.z = -0.02; tip.rotation.x = -Math.PI / 2;
    group.add(tip);
    return group;
  }

  acquire() {
    let group = this.pool.pop();
    if (!group) {
      // Pool exhausted — recycle oldest active arrow
      if (this.active.length > 0) {
        const oldest = this.active.shift();
        group = oldest.mesh;
        group.parent?.remove(group);
      } else {
        return null;
      }
    }
    group.visible = true;
    this.scene.add(group);
    return group;
  }

  release(arrowData) {
    const group = arrowData.mesh;
    // Detach from any parent (e.g. target it was stuck in)
    if (group.parent && group.parent !== this.scene) {
      group.parent.remove(group);
      this.scene.add(group);
    }
    group.visible = false;
    group.position.set(0, -100, 0);
    group.quaternion.identity();
    this.pool.push(group);
  }
}

// ==========================================
// IN-XR SETTINGS PANEL
// ==========================================
class SettingsPanel {
  constructor(parent, lab) {
    this.lab = lab;
    this.group = new THREE.Group();
    this.group.position.set(4, 1.6, -4);
    this.group.rotation.y = -Math.PI / 6;
    parent.add(this.group);

    this.buttons = [];
    this.rowSyncs = [];

    this._raycaster = new THREE.Raycaster();
    this._tmpV = new THREE.Vector3();
    this._tmpQ = new THREE.Quaternion();

    this._build();
  }

  _build() {
    const W = 3.6, H = 4.8;
    const bg = new THREE.Mesh(
      new THREE.PlaneGeometry(W, H),
      new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0.85, transparent: true })
    );
    bg.position.z = -0.01;
    this.group.add(bg);

    const title = new Text();
    title.text = "SETTINGS";
    title.fontSize = 0.14;
    title.color = 0x4ade80;
    title.anchorX = 'center';
    title.anchorY = 'middle';
    title.position.set(0, H / 2 - 0.2, 0);
    this.group.add(title);

    let y = H / 2 - 0.5;
    const rowH = 0.18;

    const addHeader = (text) => {
      const t = new Text();
      t.text = text;
      t.fontSize = 0.075;
      t.color = 0x38bdf8;
      t.anchorX = 'left';
      t.anchorY = 'middle';
      t.position.set(-W / 2 + 0.1, y, 0);
      this.group.add(t);
      y -= rowH * 0.9;
    };

    const addSlider = (label, getter, setter, min, max, step, format) => {
      format = format || (v => v.toFixed(2));
      const lbl = new Text();
      lbl.text = label;
      lbl.fontSize = 0.07;
      lbl.color = 0xe5e7eb;
      lbl.anchorX = 'left';
      lbl.anchorY = 'middle';
      lbl.position.set(-W / 2 + 0.18, y, 0);
      this.group.add(lbl);

      const val = new Text();
      val.text = format(getter());
      val.fontSize = 0.07;
      val.color = 0xfbbf24;
      val.anchorX = 'center';
      val.anchorY = 'middle';
      val.position.set(0.7, y, 0);
      this.group.add(val);

      const btnGeo = new THREE.PlaneGeometry(0.16, 0.13);
      const minusBtn = new THREE.Mesh(btnGeo, new THREE.MeshBasicMaterial({ color: 0x334155 }));
      minusBtn.position.set(1.15, y, 0);
      const plusBtn = new THREE.Mesh(btnGeo, new THREE.MeshBasicMaterial({ color: 0x334155 }));
      plusBtn.position.set(1.4, y, 0);
      this.group.add(minusBtn, plusBtn);

      const minusLbl = new Text();
      minusLbl.text = "-";
      minusLbl.fontSize = 0.11;
      minusLbl.color = 0xffffff;
      minusLbl.anchorX = 'center';
      minusLbl.anchorY = 'middle';
      minusLbl.position.set(1.15, y, 0.001);
      this.group.add(minusLbl);

      const plusLbl = new Text();
      plusLbl.text = "+";
      plusLbl.fontSize = 0.11;
      plusLbl.color = 0xffffff;
      plusLbl.anchorX = 'center';
      plusLbl.anchorY = 'middle';
      plusLbl.position.set(1.4, y, 0.001);
      this.group.add(plusLbl);

      const sync = () => { val.text = format(getter()); val.sync(); };
      this.rowSyncs.push(sync);

      this.buttons.push({
        mesh: minusBtn,
        action: () => { setter(Math.max(min, getter() - step)); sync(); }
      });
      this.buttons.push({
        mesh: plusBtn,
        action: () => { setter(Math.min(max, getter() + step)); sync(); }
      });

      y -= rowH;
    };

    const addToggle = (label, getter, setter) => {
      const lbl = new Text();
      lbl.text = label;
      lbl.fontSize = 0.07;
      lbl.color = 0xe5e7eb;
      lbl.anchorX = 'left';
      lbl.anchorY = 'middle';
      lbl.position.set(-W / 2 + 0.18, y, 0);
      this.group.add(lbl);

      const btn = new THREE.Mesh(
        new THREE.PlaneGeometry(0.55, 0.13),
        new THREE.MeshBasicMaterial({ color: getter() ? 0x10b981 : 0x6b7280 })
      );
      btn.position.set(1.25, y, 0);
      this.group.add(btn);

      const txt = new Text();
      txt.text = getter() ? "ON" : "OFF";
      txt.fontSize = 0.075;
      txt.color = 0xffffff;
      txt.anchorX = 'center';
      txt.anchorY = 'middle';
      txt.position.set(1.25, y, 0.001);
      this.group.add(txt);

      const sync = () => {
        const v = getter();
        btn.material.color.setHex(v ? 0x10b981 : 0x6b7280);
        txt.text = v ? "ON" : "OFF";
        txt.sync();
      };
      this.rowSyncs.push(sync);

      this.buttons.push({
        mesh: btn,
        action: () => { setter(!getter()); sync(); }
      });

      y -= rowH;
    };

    const addAction = (label, color, fn) => {
      const btn = new THREE.Mesh(
        new THREE.PlaneGeometry(W - 0.4, 0.15),
        new THREE.MeshBasicMaterial({ color: color })
      );
      btn.position.set(0, y, 0);
      this.group.add(btn);

      const txt = new Text();
      txt.text = label;
      txt.fontSize = 0.08;
      txt.color = 0xffffff;
      txt.anchorX = 'center';
      txt.anchorY = 'middle';
      txt.position.set(0, y, 0.001);
      this.group.add(txt);

      this.buttons.push({ mesh: btn, action: fn });
      y -= rowH + 0.02;
    };

    const lab = this.lab;

    addHeader("- PHYSICS -");
    addSlider("Gravity (m/s2)",  () => lab.GRAVITY,        v => lab.GRAVITY = v,        0,    25,   0.5,  v => v.toFixed(1));
    addSlider("Max Velocity",    () => lab.MAX_VEL,        v => lab.MAX_VEL = v,        10,   120,  5,    v => v.toFixed(0));
    addSlider("Bow Efficiency",  () => lab.BOW_EFFICIENCY, v => lab.BOW_EFFICIENCY = v, 0.1,  1.0,  0.05);
    addSlider("Arrow Mass (kg)", () => lab.ARROW_MASS,     v => lab.ARROW_MASS = v,     0.01, 0.2,  0.01);
    addSlider("Drag Coeff",      () => lab.ARROW_CD,       v => lab.ARROW_CD = v,       0,    3,    0.1,  v => v.toFixed(1));

    addHeader("- BOW -");
    addSlider("Max Draw (m)",    () => lab.MAX_DRAW,       v => lab.MAX_DRAW = v,       0.4,  1.0,  0.05);
    addSlider("Slip Dist (m)",   () => lab.SLIP_DISTANCE,  v => lab.SLIP_DISTANCE = v,  0.5,  1.2,  0.05);

    addHeader("- AUDIO -");
    addSlider("Volume",          () => masterVolume,       v => { masterVolume = v; },  0,    1,    0.1,  v => v.toFixed(1));
    addToggle("Muted",           () => muted,              v => { muted = v; });

    addHeader("- FEEDBACK -");
    addToggle("Haptics",         () => hapticsEnabled,     v => { hapticsEnabled = v; });
    addToggle("Debug Console",   () => lab.consoleGroup.visible, v => { lab.consoleGroup.visible = v; });

    addHeader("- QUIVER -");
    addSlider("Arrows",           () => lab.arrowsAvailable, v => { lab.arrowsAvailable = v; lab._updateQuiverCount(); }, 0, 99, 1, v => v.toFixed(0));
    addToggle("Auto-Nock",        () => lab.AUTO_NOCK,             v => { lab.AUTO_NOCK = v; });
    const settingsRef = this;
    const modeToggle = (label, mode) => {
      addToggle(label,
        () => lab.QUIVER_MODE === mode,
        v => {
          if (v && lab.QUIVER_MODE !== mode) {
            lab.setQuiverMode(mode);
            for (const sync of settingsRef.rowSyncs) sync();
          }
        }
      );
    };
    modeToggle("Mount: Bow",      'bow');
    modeToggle("Mount: Hip",      'hip');
    modeToggle("Mount: Shoulder", 'shoulder');
    addAction("Refill Quiver (20)", 0xfbbf24, () => lab.refillQuiver(20));

    addHeader("- WORLD -");
    addAction("Reset Arrows",    0xef4444, () => lab.resetArrows());
    addAction("Respawn Animals", 0x10b981, () => lab.respawnAnimals());

    addHeader("- MODE (next session) -");
    addToggle("AR Passthrough",
      () => window.xrMode === 'immersive-ar',
      v => {
        window.xrMode = v ? 'immersive-ar' : 'immersive-vr';
        const btnVR = document.getElementById('btn-vr');
        const btnAR = document.getElementById('btn-ar');
        const label = document.getElementById('mode-label');
        if (btnVR && btnAR && label) {
          if (v) {
            btnAR.classList.add('active'); btnVR.classList.remove('active');
            label.textContent = 'Passthrough — see your room';
          } else {
            btnVR.classList.add('active'); btnAR.classList.remove('active');
            label.textContent = 'Fully immersive';
          }
        }
        lab.labLog(`[MODE] Set ${v ? 'AR' : 'VR'} for next session.`);
      }
    );
  }

  refresh() {
    for (const s of this.rowSyncs) s();
  }

  tryClick(controller) {
    const origin = this._tmpV.setFromMatrixPosition(controller.matrixWorld).clone();
    const q = controller.getWorldQuaternion(this._tmpQ);
    const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(q);
    this._raycaster.set(origin, dir);
    this._raycaster.near = 0;
    this._raycaster.far = 10;

    const meshes = this.buttons.map(b => b.mesh);
    const hits = this._raycaster.intersectObjects(meshes, false);
    if (hits.length > 0) {
      const btn = this.buttons.find(b => b.mesh === hits[0].object);
      if (btn) {
        btn.action();
        playSound(nockBuffer, 0.5);
        pulseHaptic(controller, 0.4, 30);
        return true;
      }
    }
    return false;
  }
}

// ==========================================
// SURVIVAL PHYSICS LAB
// ==========================================
class SurvivalLab extends xb.Script {
  constructor() {
    super();
    this.arrows = [];
    this.targets = [];
    this.trees = [];
    this.animals = [];

    // REAL WORLD PHYSICS TUNING
    this.MAX_DRAW = 0.75;
    this.SLIP_DISTANCE = 0.85;
    this.MAX_VEL = 65.0;            // Linear-equivalent peak; ~70 J at full draw with stack
    this.GRAVITY = 9.81;
    this.ARROW_MASS = 0.04;
    this.BOW_EFFICIENCY = 0.75; // [FIX #13] Real recurve ~70-80% efficient

    // Phase-1 bow physics: stacking force curve
    this.STACK_THRESHOLD = 0.85;    // Fraction of MAX_DRAW where stack begins
    this.STACK_STIFFNESS = 50.0;    // How sharply force rises past threshold

    // Arrow rest is offset slightly off the bow's central axis so the arrow
    // shaft passes alongside the riser instead of through it.
    this.REST_OFFSET_X = 0.025;     // Right-hand archer: arrow on +x side of riser

    // [FIX #9] Aerodynamic drag constants
    this.AIR_DENSITY = 1.225;       // kg/m³ at sea level
    this.ARROW_CD = 0.55;           // Spin-stabilized fletched arrow
    this.ARROW_CROSS_AREA = 0.00005; // ~8mm diameter shaft cross-section m²

    this.bowAttached = false;
    this.leftController = null;
    this.rightController = null;
    this.isDrawing = false;
    this.drawDistance = 0;
    this.fatigueTimer = 0.0;
    this.holdSeconds = 0.0; // Time at >25% draw (for hold tremor)

    // [FIX #2, #5] Pre-allocated temp objects — zero per-frame allocation
    this._raycaster = new THREE.Raycaster();
    this._tmpVec3A = new THREE.Vector3();
    this._tmpVec3B = new THREE.Vector3();
    this._tmpVec3C = new THREE.Vector3();
    this._tmpQuat = new THREE.Quaternion();
    this._tmpEuler = new THREE.Euler();

    // [FIX #4] Troika text batching
    this._consoleDirty = false;

    // [FIX #11] Fatigue audio cooldown
    this._lastCreakTime = 0;

    // Hold-tremor state (procedural multi-frequency wobble)
    this._tremorTime = 0;
    this._tremorPhaseX = Math.random() * Math.PI * 2;
    this._tremorPhaseY = Math.random() * Math.PI * 2;
    this._tremorYaw = 0;     // current yaw offset (radians)
    this._tremorPitch = 0;   // current pitch offset (radians)

    // Anchor consistency: rolling history of right-hand draw position (bow-local)
    this._anchorHistory = [];
    this._anchorMax = 5;

    // Controller model rendering (auto-loaded from WebXR profile)
    this._controllerModelFactory = new XRControllerModelFactory();
    this._gripsAdded = [false, false];

    // Quiver / arrow inventory
    this.arrowsAvailable = 20;
    this.QUIVER_GRAB_RADIUS = 0.28;
    this.NOCK_SNAP_RADIUS = 0.22;
    this.AUTO_NOCK = false;            // when true, skips quiver — nock spawns an arrow directly
    this.QUIVER_MODES = ['bow', 'hip', 'shoulder'];
    this.QUIVER_MODE = 'bow';          // bow-mounted by default (most convenient)
    this.heldArrowState = 'none';      // 'none' | 'holding' | 'drawing'
    this.heldArrow = null;
  }

  init() {
    this.setupEnvironment();
    this.setupVRConsole();
    this.createSharedArrowAssets(); // [FIX #1]
    this.createBow();
    this.setupQuiver();
    this.buildTestingZones();
    this.setupSettingsPanel();
    this.setupPointerRay();
    this.labLog("System Initialized. Awaiting physical input...");
  }

  setupSettingsPanel() {
    this.settings = new SettingsPanel(this, this);
  }

  setupPointerRay() {
    const geo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, -3)
    ]);
    this.pointerRay = new THREE.Line(
      geo,
      new THREE.LineBasicMaterial({ color: 0x60a5fa, transparent: true, opacity: 0.5 })
    );
    this.pointerRay.visible = false;
    this.add(this.pointerRay);
  }

  // ── Quiver ──────────────────────────────────────────────────────────────────
  setupQuiver() {
    this.quiverGroup = new THREE.Group();
    // Fixed world position: right of player spawn, hip-height, forward enough
    // to be reachable. Player is largely stationary by design.
    this.quiverGroup.position.set(0.45, 1.0, -0.45);
    this.add(this.quiverGroup);

    // Body: closed cylinder so it has a clear silhouette from any angle.
    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.07, 0.05, 0.4, 16),
      new THREE.MeshLambertMaterial({ color: 0x6b4423 })
    );
    this.quiverGroup.add(body);

    // Bright accent ring at the rim so it's easy to spot.
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(0.07, 0.012, 8, 24),
      new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 0.2;
    this.quiverGroup.add(rim);

    // Visible arrow shafts inside the quiver, sticking up
    this._quiverVisualArrows = [];
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2;
      const r = 0.035;
      const arrow = new THREE.Mesh(this._arrowShaftGeo, this._arrowShaftMat);
      arrow.position.set(Math.cos(angle) * r, 0.3, Math.sin(angle) * r);
      // Cylinder defaults to Y axis; our shaft geo was already +Y aligned — keep it vertical.
      this.quiverGroup.add(arrow);
      this._quiverVisualArrows.push(arrow);
    }

    // Arrow count label
    this.quiverCountText = new Text();
    this.quiverCountText.fontSize = 0.07;
    this.quiverCountText.color = 0xfbbf24;
    this.quiverCountText.anchorX = 'center';
    this.quiverCountText.anchorY = 'middle';
    this.quiverCountText.position.set(0, 0.65, 0);
    this.quiverGroup.add(this.quiverCountText);

    this._updateQuiverCount();
    this.setQuiverMode(this.QUIVER_MODE);
  }

  setQuiverMode(mode) {
    if (!this.QUIVER_MODES.includes(mode)) return;
    this.QUIVER_MODE = mode;
    if (!this.quiverGroup) return;
    this.quiverGroup.parent?.remove(this.quiverGroup);
    this.quiverGroup.quaternion.identity();
    if (mode === 'bow') {
      // Mounted on the bow, just above the riser. Always visible with the bow,
      // single fluid reach for grab + nock.
      if (this.bowGroup) {
        this.bowGroup.add(this.quiverGroup);
        this.quiverGroup.position.set(0, 0.30, 0.05);
        this.quiverGroup.scale.setScalar(0.55);
      }
    } else if (mode === 'hip') {
      this.add(this.quiverGroup);
      this.quiverGroup.position.set(0.45, 1.0, -0.45);
      this.quiverGroup.scale.setScalar(1.0);
    } else if (mode === 'shoulder') {
      // Sits over the right shoulder; _updateQuiverPosition re-anchors it to
      // the headset each frame.
      this.add(this.quiverGroup);
      this.quiverGroup.scale.setScalar(0.55);
    }
    this.labLog(`[QUIVER] Mounted on: ${mode}`);
  }

  _updateQuiverCount() {
    if (this.quiverCountText) {
      this.quiverCountText.text = `${this.arrowsAvailable}`;
      this.quiverCountText.sync();
    }
    if (this._quiverVisualArrows) {
      const visible = Math.min(
        this._quiverVisualArrows.length,
        Math.ceil(this.arrowsAvailable / 4)
      );
      for (let i = 0; i < this._quiverVisualArrows.length; i++) {
        this._quiverVisualArrows[i].visible = i < visible;
      }
    }
  }

  refillQuiver(count = 20) {
    this.arrowsAvailable = count;
    this._updateQuiverCount();
    this.labLog(`[QUIVER] Refilled to ${count} arrows.`);
  }

  // Build a visual arrow group (shaft + tip), parented to the given controller,
  // extending forward (toward -z) of the hand with the nock at the controller origin.
  _grabArrow(ctrl) {
    if (this.arrowsAvailable <= 0) {
      this.labLog("[QUIVER] Empty.");
      pulseHaptic(ctrl, 0.1, 80);
      return false;
    }

    const held = new THREE.Group();
    const shaft = new THREE.Mesh(this._arrowShaftGeo, this._arrowShaftMat);
    shaft.position.z = 0.4;
    shaft.rotation.x = Math.PI / 2;
    held.add(shaft);
    const tip = new THREE.Mesh(this._arrowTipGeo, this._arrowTipMat);
    tip.position.z = -0.02;
    tip.rotation.x = -Math.PI / 2;
    held.add(tip);
    // Place so tip extends forward of the hand and nock end sits at the controller.
    held.position.set(0, 0, -0.8);

    ctrl.add(held);
    this.heldArrow = held;
    this.heldArrowState = 'holding';
    this.arrowsAvailable--;
    this._updateQuiverCount();

    playSound(nockBuffer, 0.6);
    pulseHaptic(ctrl, 0.4, 40);
    this.labLog(`[QUIVER] Arrow drawn (${this.arrowsAvailable} left).`);
    return true;
  }

  _consumeQuiverArrow() {
    if (this.arrowsAvailable <= 0) return false;
    this.arrowsAvailable--;
    this._updateQuiverCount();
    return true;
  }

  _startNock(ctrl) {
    if (this.heldArrow) {
      this.heldArrow.parent?.remove(this.heldArrow);
      this.heldArrow = null;
    }
    this.rightController = ctrl;
    this.isDrawing = true;
    this.loadedArrow.visible = true;
    this.heldArrowState = 'drawing';

    playSound(nockBuffer, 0.6);
    pulseHaptic(ctrl, 0.3, 30);

    ctrl.addEventListener('disconnected', () => this._onControllerDisconnect('right'));
  }

  _dropArrow() {
    if (!this.heldArrow) return;
    this.heldArrow.parent?.remove(this.heldArrow);
    this.heldArrow = null;
    this.heldArrowState = 'none';
    this.labLog("[QUIVER] Arrow dropped.");
  }

  resetArrows() {
    for (const a of this.arrows) {
      this.arrowPool.release(a);
    }
    this.arrows.length = 0;
    this.arrowPool.active.length = 0;
    this.labLog("[ACTION] All arrows cleared.");
  }

  respawnAnimals() {
    for (const a of this.animals) {
      a.state = 'IDLE';
      a.group.position.copy(a.origin);
      a.velocity.set(0, 0, 0);
      a.fleeTimer = 0;
      a.label.text = "Prey";
      a.label.color = 0x4ade80;
    }
    this.labLog("[ACTION] Animals respawned.");
  }

  // ── Phase 1 bow physics helpers ─────────────────────────────────────────────

  // Force curve as a function of draw ratio r ∈ [0, 1].
  // Linear up to STACK_THRESHOLD, then a quadratic stack term piles on.
  // Returns force in arbitrary units where linear full-draw force = 1.
  _drawForce(r) {
    let f = r;
    if (r > this.STACK_THRESHOLD) {
      const x = r - this.STACK_THRESHOLD;
      f += this.STACK_STIFFNESS * x * x;
    }
    return f;
  }

  // Stored elastic energy ratio: ∫₀ʳ F(s) ds, normalized so linear at r=1 → 1.
  // Stacking pushes energy past 1 in the last fraction of the draw.
  _drawEnergyRatio(r) {
    let e = 0.5 * r * r;
    if (r > this.STACK_THRESHOLD) {
      const x = r - this.STACK_THRESHOLD;
      e += this.STACK_STIFFNESS * x * x * x / 3;
    }
    return e * 2;
  }

  // Output arrow speed for given draw ratio, applying efficiency.
  _drawSpeed(r) {
    return Math.sqrt(this._drawEnergyRatio(r)) * this.MAX_VEL * Math.sqrt(this.BOW_EFFICIENCY);
  }

  // Update procedural hold tremor. Magnitude grows with draw and hold time.
  _updateTremor(dt, drawRatio) {
    this._tremorTime += dt;
    const baseMag = 0.003;
    const drawMag = drawRatio * 0.008;
    const holdMag = Math.min(0.015, this.holdSeconds * 0.003);
    const mag = baseMag + drawMag + holdMag;
    const t = this._tremorTime;
    this._tremorYaw = (
      Math.sin(t * 5.7 + this._tremorPhaseX) * 0.6 +
      Math.sin(t * 13.3 + this._tremorPhaseX * 2) * 0.4
    ) * mag;
    this._tremorPitch = (
      Math.sin(t * 4.9 + this._tremorPhaseY) * 0.6 +
      Math.sin(t * 11.7 + this._tremorPhaseY * 1.5) * 0.4
    ) * mag * 0.7;
  }

  // Anchor consistency scatter: deviation of current draw position from
  // the rolling mean of recent shots. Returns radian magnitude.
  _anchorScatter(currentLocal) {
    if (this._anchorHistory.length < 2) return 0;
    const mean = this._tmpVec3A.set(0, 0, 0);
    for (const a of this._anchorHistory) mean.add(a);
    mean.divideScalar(this._anchorHistory.length);
    const dev = currentLocal.distanceTo(mean);
    // 1 cm deviation → 0.01 rad scatter (~0.6°), capped at ~3°.
    return Math.min(0.05, dev * 1.0);
  }

  _recordAnchor(localPos) {
    this._anchorHistory.push(localPos.clone());
    if (this._anchorHistory.length > this._anchorMax) this._anchorHistory.shift();
  }

  // [FIX #17] Dedicated log function — no global console.log override
  labLog(msg) {
    console.log(msg); // Still goes to browser devtools
    const maxLogs = 15;
    this.logs.push(`> ${msg}`);
    if (this.logs.length > maxLogs) this.logs.shift();
    this._consoleDirty = true; // [FIX #4] Defer sync to update()
  }

  setupEnvironment() {
    this.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(5, 10, 5);
    this.add(dir);

    // [FIX #8] MeshLambertMaterial for static scenery

      new THREE.PlaneGeometry(50, 50),

    this.add(this.floor);

    // [FIX #18] Reduced grid density
    this.grid = new THREE.GridHelper(50, 10, 0x475569, 0x1e293b);

  // Toggle environment for AR (passthrough) vs VR
  applyXRMode(isAR) {
    // Hide floor and grid in AR so you see your real room
    this.floor.visible = !isAR;
    this.grid.visible = !isAR;

    // Make renderer background transparent for passthrough
    const renderer = xb.core?.renderer;
    if (renderer) {
      if (isAR) {
        renderer.setClearColor(0x000000, 0);
        renderer.setClearAlpha(0);
      } else {
        renderer.setClearColor(0x1e293b, 1);
        renderer.setClearAlpha(1);
      }
    }

    this.labLog(isAR ? "[MODE] AR Passthrough — floor hidden" : "[MODE] VR Immersive — full environment");
  }

  // [FIX #1] Shared geometry and materials — created once, reused for all arrows
  createSharedArrowAssets() {
    this._arrowShaftGeo = new THREE.CylinderGeometry(0.004, 0.004, 0.8, 8);
    this._arrowTipGeo = new THREE.ConeGeometry(0.008, 0.04, 8);
    // [FIX #8] Lambert for arrows too
    this._arrowShaftMat = new THREE.MeshLambertMaterial({ color: 0xe2e8f0 });
    this._arrowTipMat = new THREE.MeshLambertMaterial({ color: 0x94a3b8 });
  }

  buildTestingZones() {
    this.createTarget(-2, 1.0, -5, "Straw Target\nArmor: 15 J", 0xd4a373, 15);
    this.createTarget(2, 1.0, -5, "Iron Target\nArmor: 65 J", 0x94a3b8, 65);
    this.createTestTree(0, 0, -8);
    this.createAnimal(3, 0, -10);
    this.createAnimal(-3, 0, -10);
  }

  createTarget(x, y, z, labelStr, hexColor, armorVal) {
    const group = new THREE.Group();
    group.position.set(x, y, z);

    const radius = 0.5;
    // [FIX #8] Lambert for targets
    const board = new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius, 0.1, 32),
      new THREE.MeshLambertMaterial({ color: hexColor })
    );
    board.rotateX(Math.PI / 2);
    group.add(board);

    const stand = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, y),
      new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
    );
    stand.position.y = -y / 2;
    group.add(stand);

    const label = new Text();
    label.text = labelStr;
    label.fontSize = 0.15;
    label.color = 0xffffff;
    label.position.set(0, radius + 0.2, 0);
    label.anchorX = 'center';
    label.textAlign = 'center';
    group.add(label);

    this.add(group);
    // Store the face normal for this target (faces +Z in local space, rotated to world)
    const faceNormal = new THREE.Vector3(0, 0, 1);
    this.targets.push({ mesh: board, group: group, radius: radius, armor: armorVal, faceNormal: faceNormal });
  }

  createTestTree(x, y, z) {
    const group = new THREE.Group();
    group.position.set(x, y, z);

    const trunkHeight = 3.0;
    const trunkRadius = 0.2;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(trunkRadius, trunkRadius, trunkHeight, 8),
      new THREE.MeshLambertMaterial({color: 0x3d2817})
    );
    trunk.position.y = trunkHeight / 2;
    group.add(trunk);

    const canopyRadius = 1.5;
    const canopyHeight = 3.0;
    const leaves = new THREE.Mesh(
      new THREE.SphereGeometry(canopyRadius, 8, 8),
      new THREE.MeshBasicMaterial({color: 0x22c55e, wireframe: true, transparent: true, opacity: 0.3})
    );
    leaves.position.y = trunkHeight;
    group.add(leaves);

    this.add(group);
    this.trees.push({ x: x, z: z, trunkRadius: trunkRadius, trunkHeight: trunkHeight, canopyY: trunkHeight, canopyRadius: canopyRadius });
  }

  createAnimal(x, y, z) {
    const group = new THREE.Group();

      new THREE.BoxGeometry(0.4, 0.6, 0.8),
      new THREE.MeshLambertMaterial({color: 0xa0522d})
    );
    body.position.y = 0.5;
    group.add(body);

    const label = new Text();

    label.position.set(0, 1.2, 0);
    label.anchorX = 'center';
    group.add(label);

    // [FIX #15] Animals have flee timer and origin for return
    this.animals.push({
      group: group,
      state: 'IDLE',
      label: label,
      velocity: new THREE.Vector3(),
      fleeTimer: 0,
      origin: new THREE.Vector3(x, y, z)
    });
  }

  createBow() {
    this.bowGroup = new THREE.Group();
    const curvePoints = [
      new THREE.Vector3(0,  0.7,  0),     // top tip — at brace plane
      new THREE.Vector3(0,  0.3, -0.15),  // upper limb bulges toward target
      new THREE.Vector3(0, -0.3, -0.15),  // lower limb bulges toward target
      new THREE.Vector3(0, -0.7,  0)      // bottom tip — at brace plane
    ];
    const curve = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(curvePoints), 20, 0.015, 8, false);
    this.bowGroup.add(new THREE.Mesh(curve, new THREE.MeshLambertMaterial({ color: 0x1a1a1a })));

    const stringGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0,  0.7, 0),
      new THREE.Vector3(0,  0,   0),  // string brace mid — at archer side of riser
      new THREE.Vector3(0, -0.7, 0)
    ]);
    this.stringLine = new THREE.Line(stringGeo, new THREE.LineBasicMaterial({color: 0xffffff, linewidth: 2}));
    this.bowGroup.add(this.stringLine);

    this.bowHud = new Text();
    this.bowHud.fontSize = 0.03;
    this.bowHud.color = 0x38bdf8;
    this.bowHud.position.set(-0.05, 0, 0);
    this.bowHud.rotation.y = -Math.PI / 2;
    this.bowHud.anchorX = 'right';
    this.bowHud.anchorY = 'middle';
    this.bowHud.text = "KE: 0\nFatigue: 0%";
    this.bowGroup.add(this.bowHud);

    // Loaded arrow visual uses shared geometry [FIX #1]
    this.loadedArrow = new THREE.Group();
    const shaft = new THREE.Mesh(this._arrowShaftGeo, this._arrowShaftMat);
    shaft.position.z = 0.4; shaft.rotation.x = Math.PI / 2;
    this.loadedArrow.add(shaft);
    this.loadedArrow.visible = false;
    this.bowGroup.add(this.loadedArrow);

    this.bowGroup.position.set(0, 1.2, -0.5);
    this.add(this.bowGroup);

    // [FIX #7] Create arrow pool after shared assets exist
    this.arrowPool = new ArrowPool(this, this._arrowShaftGeo, this._arrowTipGeo, this._arrowShaftMat, this._arrowTipMat, 20);
  }

  onSelectStart(event) {
    initAudio();
    const ctrl = event.target;

    // Settings panel takes priority when controller is aimed at it (and not mid-draw).
    if (!this.isDrawing && this.settings && this.settings.tryClick(ctrl)) {
      return;
    }

    const handedness = ctrl.xrInputSource?.handedness;

    // [FIX C1] Use handedness exclusively when available
    const isLeft = handedness === 'left' || (!handedness && ctrl === xb.core.input.controllers[0]);
    const isRight = handedness === 'right' || (!handedness && ctrl === xb.core.input.controllers[1]);

    if (isLeft && !this.bowAttached) {
      ctrl.add(this.bowGroup);
      this.bowGroup.position.set(0, 0, -0.05);
      this.bowGroup.rotation.set(0, 0, 0);
      this.leftController = ctrl;
      this.bowAttached = true;
      this.labLog("Bow attached to left hand.");

      // [FIX #6] Listen for disconnect on this controller
      ctrl.addEventListener('disconnected', () => this._onControllerDisconnect('left'));
      return;
    }
    if (isRight && this.bowAttached) {
      const rightHandWorld = this._tmpVec3A.setFromMatrixPosition(ctrl.matrixWorld);

      // 1. If idle, try to grab an arrow from the quiver.
      if (this.heldArrowState === 'none' && this.quiverGroup) {
        const quiverWorld = this._tmpVec3B.setFromMatrixPosition(this.quiverGroup.matrixWorld);
        if (rightHandWorld.distanceTo(quiverWorld) < this.QUIVER_GRAB_RADIUS) {
          this._grabArrow(ctrl);
          return;
        }
      }

      // 2. If holding an arrow (or AUTO_NOCK is on), check string proximity to nock.
      const localRightHand = this.bowGroup.worldToLocal(rightHandWorld.clone());
      const stringDist = localRightHand.length();
      const nearString = stringDist < 0.3 && localRightHand.z < 0.25;

      if (nearString) {
        if (this.heldArrowState === 'holding') {
          this._startNock(ctrl);
          return;
        }
        if (this.heldArrowState === 'none' && this.AUTO_NOCK) {
          if (!this._consumeQuiverArrow()) {
            this.labLog("[QUIVER] Empty.");
            return;
          }
          this._startNock(ctrl);
          return;
        }
        if (this.heldArrowState === 'none') {
          this.labLog("[INPUT] No arrow nocked. Reach to the quiver first.");
          return;
        }
      } else {
        this.labLog("[INPUT] Ignored: Hand too far from quiver and string.");
      }
    }
  }

  // [FIX #6] Controller disconnect handler
  _onControllerDisconnect(hand) {
    if (hand === 'right' && this.isDrawing) {
      this.labLog("[WARN] Right controller disconnected during draw. Resetting.");
      this.resetDrawState();
    }
    if (hand === 'left' && this.bowAttached) {
      this.labLog("[WARN] Left controller disconnected. Detaching bow.");
      this.bowGroup.parent?.remove(this.bowGroup);
      this.add(this.bowGroup);
      this.bowGroup.position.set(0, 1.2, -0.5);
      this.bowAttached = false;
      this.leftController = null;
      this.resetDrawState();
    }
  }

  onSelecting(event) {
    const ctrl = event.target;

    // Holding → nock: when the right hand brings the held arrow within reach
    // of the bow string (trigger already held since the grab), snap it onto
    // the string and start drawing.
    if (this.heldArrowState === 'holding' && this.bowAttached) {
      const ctrlWorld = this._tmpVec3A.setFromMatrixPosition(ctrl.matrixWorld);
      const localCtrl = this.bowGroup.worldToLocal(ctrlWorld.clone());
      if (localCtrl.length() < this.NOCK_SNAP_RADIUS && localCtrl.z < 0.2) {
        this._startNock(ctrl);
      }
    }

    if (this.isDrawing && ctrl === this.rightController && this.bowAttached) {
      // [FIX #5] Reuse pre-allocated vectors
      const rightHandWorld = this._tmpVec3A.setFromMatrixPosition(this.rightController.matrixWorld);
      const localRightHand = this.bowGroup.worldToLocal(rightHandWorld.clone());

      // Slip only triggers when the hand is past the brace plane on the
      // archer side AND has been pulled past the slip radius.
      const handRadial = localRightHand.length();
      if (localRightHand.z > 0 && handRadial > this.SLIP_DISTANCE) {
          this.labLog(`[OVERDRAW] String slipped! Pulled past ${this.SLIP_DISTANCE}m.`);
          this.executeFire();
          this.resetDrawState();
          return;
      }

      // Apex (string-pull point) is the right-hand position only when the
      // hand is on the archer side of the brace plane. In front of the bow
      // the string can't be deflected, so the apex stays at brace center.
      let apex;
      if (localRightHand.z > 0) {
        apex = localRightHand.clone();
        const len = apex.length();
        if (len > this.MAX_DRAW && len > 0.0001) {
          apex.multiplyScalar(this.MAX_DRAW / len);
        }
      } else {
        apex = new THREE.Vector3(0, 0, 0);
      }
      this.drawDistance = apex.length();

      const positions = this.stringLine.geometry.attributes.position.array;
      positions[3] = apex.x;
      positions[4] = apex.y;
      positions[5] = apex.z;
      this.stringLine.geometry.attributes.position.needsUpdate = true;

      // Loaded arrow runs from the rest (offset off the riser axis) to the
      // nock (apex). Direction = rest → apex extended; the arrow shaft
      // passes alongside the riser, not through it.
      const restLocal = this._tmpVec3B.set(this.REST_OFFSET_X, 0, 0);
      if (this.drawDistance > 0.05) {
        const fireDirLocal = restLocal.clone().sub(apex);
        const fl = fireDirLocal.length();
        if (fl > 0.0001) {
          fireDirLocal.divideScalar(fl); // forward direction (apex → rest extended)
          const tipPos = apex.clone().addScaledVector(fireDirLocal, 0.8);
          this.loadedArrow.position.copy(tipPos);
          // Loaded arrow's local +Z = direction from tip to nock = -fireDir
          this.loadedArrow.quaternion.setFromUnitVectors(
            new THREE.Vector3(0, 0, 1), fireDirLocal.clone().negate()
          );
        }
      } else {
        this.loadedArrow.position.set(this.REST_OFFSET_X, 0, -0.8);
        this.loadedArrow.quaternion.identity();
      }

      const dt = xb.getDeltaTime();
      const drawRatio = this.drawDistance / this.MAX_DRAW;

      // Stacking-curve velocity / KE
      const speed = this._drawSpeed(drawRatio);
      const estKE = 0.5 * this.ARROW_MASS * speed * speed;

      // Hold-time tracking (for tremor magnitude)
      if (drawRatio > 0.33) {
        this.holdSeconds += dt;
      } else {
        this.holdSeconds = Math.max(0, this.holdSeconds - dt * 2);
      }

      // Procedural hold tremor: composed on top of off-axis orientation.
      this._updateTremor(dt, drawRatio);
      const tremorQ = new THREE.Quaternion().setFromEuler(
        new THREE.Euler(this._tremorPitch, this._tremorYaw, 0, 'XYZ')
      );
      this.loadedArrow.quaternion.multiply(tremorQ);

      // Extra haptic kick when entering the stack region
      if (drawRatio > this.STACK_THRESHOLD) {
        const stackBoost = (drawRatio - this.STACK_THRESHOLD) / (1 - this.STACK_THRESHOLD);
        pulseHaptic(this.rightController, 0.15 + stackBoost * 0.5, 20);
      }

      if (drawRatio > 0.8) {
        this.fatigueTimer += dt;
      } else {
        this.fatigueTimer = Math.max(0, this.fatigueTimer - dt * 2);
      }

      let fatiguePercent = Math.min(100, (this.fatigueTimer / 3.0) * 100);

      // [FIX #11] Progressive fatigue feedback
      const now = performance.now();
      if (fatiguePercent >= 50 && fatiguePercent < 80) {
        pulseHaptic(this.rightController, 0.1, 20);
      } else if (fatiguePercent >= 80 && fatiguePercent < 100) {
        pulseHaptic(this.rightController, 0.4, 30);
        if (now - this._lastCreakTime > 800) {
          playSound(creakBuffer, 0.4);
          this._lastCreakTime = now;
        }
        this.bowHud.color = 0xfbbf24; // Yellow warning
      }

      if (fatiguePercent >= 100) {
        pulseHaptic(this.rightController, 1.0, 50);
        this.bowHud.color = 0xef4444; // Red critical
      } else if (fatiguePercent < 80) {
        this.bowHud.color = 0x38bdf8; // Normal blue
      }

      this.bowHud.text = `KE: ${estKE.toFixed(0)} J\nFatigue: ${fatiguePercent.toFixed(0)}%`;
    }
  }

  onSelectEnd(event) {
    const ctrl = event.target;
    if (this.isDrawing && ctrl === this.rightController) {
      this.executeFire();
      this.resetDrawState();
      this.heldArrowState = 'none';
      return;
    }
    if (this.heldArrowState === 'holding') {
      this._dropArrow();
    }
  }

  executeFire() {
      if (this.drawDistance > 0.25) {
        pulseHaptic(this.rightController, 1.0, 50);
        pulseHaptic(this.leftController, 0.8, 30);

        // Capture nock (right hand) in bow-local; clamp to draw side.
        const rightHandWorld = this._tmpVec3C.setFromMatrixPosition(this.rightController.matrixWorld);
        const apex = this.bowGroup.worldToLocal(rightHandWorld.clone());
        if (apex.z < 0) apex.z = 0;
        const apexLen = apex.length();
        if (apexLen > this.MAX_DRAW && apexLen > 0.0001) {
          apex.multiplyScalar(this.MAX_DRAW / apexLen);
        }

        // Anchor consistency
        const anchorScatter = this._anchorScatter(apex);
        this._recordAnchor(apex);

        // Firing direction = rest → apex extended (forward through the rest).
        // Using the offset rest matches the loaded-arrow visual and prevents
        // the arrow from clipping the riser.
        const restLocal = new THREE.Vector3(this.REST_OFFSET_X, 0, 0);
        const fireDirLocal = restLocal.clone().sub(apex);
        const fl = fireDirLocal.length();
        const localDir = fl > 0.0001
          ? fireDirLocal.divideScalar(fl)
          : new THREE.Vector3(0, 0, -1);
        const tipLocal = apex.clone().addScaledVector(localDir, 0.8);
        const spawnWorld = this.bowGroup.localToWorld(tipLocal.clone());

        const drawRatio = this.drawDistance / this.MAX_DRAW;
        const velocityMag = this._drawSpeed(drawRatio);
        const estKE = 0.5 * this.ARROW_MASS * velocityMag * velocityMag;

        // Apply tremor + anchor scatter as bow-local angular perturbation,
        // then transform to world.
        const yawErr = this._tremorYaw + (Math.random() - 0.5) * 2 * anchorScatter;
        const pitchErr = this._tremorPitch + (Math.random() - 0.5) * anchorScatter;
        const dir = localDir.clone();
        dir.applyEuler(this._tmpEuler.set(pitchErr, yawErr, 0, 'XYZ'));
        dir.applyQuaternion(this.bowGroup.getWorldQuaternion(this._tmpQuat));
        const velocityVec = dir.clone().multiplyScalar(velocityMag);

        // Lateral pull amount (degrees off bow forward) for diagnostics.
        const offAxisDeg = Math.acos(Math.min(1, Math.max(-1, -localDir.z))) * 180 / Math.PI;

        let wobbleApplied = false;
        if (this.fatigueTimer >= 3.0) {
            const wobble = Math.min(1.0, (this.fatigueTimer - 3.0) / 2.0);
            velocityVec.x += (Math.random() - 0.5) * 6.0 * wobble;
            velocityVec.y += (Math.random() - 0.5) * 6.0 * wobble;
            velocityVec.z += (Math.random() - 0.5) * 6.0 * wobble;
            wobbleApplied = true;
        }

        const tremorDeg = (Math.hypot(this._tremorYaw, this._tremorPitch) * 180 / Math.PI).toFixed(1);
        const scatterDeg = (anchorScatter * 180 / Math.PI).toFixed(1);
        this.labLog(`[FIRE] V: ${velocityMag.toFixed(1)}m/s | KE: ${estKE.toFixed(1)}J | OffAxis: ${offAxisDeg.toFixed(1)}° | Tremor: ${tremorDeg}° | Anchor: ${scatterDeg}°${wobbleApplied ? ' | FATIGUE' : ''}`);

        this.fireArrow(spawnWorld, velocityVec, this.bowGroup.getWorldQuaternion(this._tmpQuat.clone()));
      } else {
        this.labLog(`[FIRE] Canceled: Draw too weak (${this.drawDistance.toFixed(2)}m). Needs 0.25m`);
      }
  }

  resetDrawState() {
      this.isDrawing = false;
      this.loadedArrow.visible = false;
      this.loadedArrow.rotation.set(0, 0, 0);
      const positions = this.stringLine.geometry.attributes.position.array;
      positions[3] = 0;
      positions[4] = 0;
      positions[5] = 0;
      this.stringLine.geometry.attributes.position.needsUpdate = true;
      this.bowHud.text = "KE: 0 J\nFatigue: 0%";
      this.bowHud.color = 0x38bdf8;
      this.drawDistance = 0;
      this.fatigueTimer = 0;
      this.holdSeconds = 0;
      this._tremorYaw = 0;
      this._tremorPitch = 0;
      this.heldArrowState = 'none';
  }

  fireArrow(startPos, velocityVector, orientation) {
    // [FIX #7] Use object pool instead of creating new meshes
    const group = this.arrowPool.acquire();
    if (!group) {
      this.labLog("[WARN] Arrow pool exhausted.");
      return;
    }

    group.position.copy(startPos);
    group.quaternion.copy(orientation);

    const arrowData = {
      mesh: group,
      velocity: velocityVector.clone(),
      active: true,
      deflected: false,
      life: 6.0
    };

    this.arrows.push(arrowData);
    this.arrowPool.active.push(arrowData);

    playSound(twangBuffer, 0.8);
  }

  triggerSoundEvent(origin, radius) {
    const ripple = new THREE.Mesh(
      new THREE.RingGeometry(radius-0.1, radius, 32),
      new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.5, side: THREE.DoubleSide})
    );
    ripple.rotation.x = -Math.PI/2;
    ripple.position.copy(origin);
    ripple.position.y = 0.1;
    this.add(ripple);
    setTimeout(() => {
      this.remove(ripple);
      ripple.geometry.dispose();
      ripple.material.dispose();
    }, 200);

    let spookCount = 0;
    this.animals.forEach(animal => {
        if (animal.state === 'IDLE' && animal.group.position.distanceTo(origin) <= radius) {
            animal.state = 'FLEE';
            animal.fleeTimer = 0; // [FIX #15] Reset flee timer
            animal.label.text = "SPOOKED!";
            animal.label.color = 0xef4444;
            playSound(spookBuffer, 1.0);
            animal.velocity.subVectors(animal.group.position, origin).normalize().multiplyScalar(6.0);
            spookCount++;
        }
    });
    if (spookCount > 0) this.labLog(`[ACOUSTIC] Sound radius ${radius}m spooked ${spookCount} animals.`);
  }

  updateArrows(dt) {
    const gravityVec = this._tmpVec3C.set(0, -this.GRAVITY, 0);

    for (let i = this.arrows.length - 1; i >= 0; i--) {
      const arrow = this.arrows[i];
      if (!arrow.active) continue;

      arrow.life -= dt;
      if (arrow.life <= 0 || arrow.mesh.position.y <= -0.5) {
        if (arrow.mesh.position.y <= -0.5 && arrow.active) {
            this.triggerSoundEvent(arrow.mesh.position, 5.0);
        }
        // [FIX #7] Release back to pool
        this.arrowPool.release(arrow);
        this.arrows.splice(i, 1);
        const poolIdx = this.arrowPool.active.indexOf(arrow);
        if (poolIdx !== -1) this.arrowPool.active.splice(poolIdx, 1);
        continue;
      }

      const prevPos = this._tmpVec3A.copy(arrow.mesh.position);

      // [FIX #9] Aerodynamic drag: F_drag = -½ρCdAv²  →  a_drag = F/m
      const speedSq = arrow.velocity.lengthSq();
      if (speedSq > 0.01) {
        const speed = Math.sqrt(speedSq);
        const dragMag = 0.5 * this.AIR_DENSITY * this.ARROW_CD * this.ARROW_CROSS_AREA * speedSq;
        const dragAccel = dragMag / this.ARROW_MASS;
        // Drag opposes velocity direction
        const dragVec = this._tmpVec3B.copy(arrow.velocity).normalize().multiplyScalar(-dragAccel * dt);
        arrow.velocity.add(dragVec);
      }

      arrow.velocity.addScaledVector(gravityVec, dt);
      arrow.mesh.position.addScaledVector(arrow.velocity, dt);

      if (arrow.velocity.lengthSq() > 0.01) {
         arrow.mesh.lookAt(arrow.mesh.position.clone().add(arrow.velocity));
      }

      const stepDist = prevPos.distanceTo(arrow.mesh.position);
      const flightDir = this._tmpVec3B.copy(arrow.velocity).normalize();

      // [FIX #2] Reuse cached raycaster
      this._raycaster.set(prevPos, flightDir);
      this._raycaster.near = 0;
      this._raycaster.far = stepDist;

      let hitTrunk = false;
      for (const tree of this.trees) {
        if (!arrow.deflected) {
            const distToCanopy = arrow.mesh.position.distanceTo(
              this._tmpVec3A.set(tree.x, tree.canopyY, tree.z)
            );
            if (distToCanopy < tree.canopyRadius) {
                arrow.deflected = true;
                playSound(leafBuffer, 0.8);

                // [FIX #10] Anisotropic foliage deflection — primarily forward with lateral scatter
                const fwd = this._tmpVec3A.copy(arrow.velocity).normalize();
                const forwardSpeed = arrow.velocity.length() * 0.5; // Lose 50% forward speed
                arrow.velocity.copy(fwd).multiplyScalar(forwardSpeed);
                // Add small lateral scatter perpendicular to flight
                arrow.velocity.x += (Math.random() - 0.5) * 3.0;
                arrow.velocity.y += (Math.random() - 0.5) * 2.0;
                // Minimal forward scatter — the arrow doesn't reverse
                arrow.velocity.z += (Math.random() - 0.5) * 1.5;

                this.labLog("[DEFLECTION] Arrow hit foliage. Trajectory deflected.");
            }
        }

        if (arrow.mesh.position.y < tree.trunkHeight &&
            Math.hypot(arrow.mesh.position.x - tree.x, arrow.mesh.position.z - tree.z) < tree.trunkRadius + 0.05) {
          arrow.active = false;
          hitTrunk = true;
          playSound(bounceBuffer, 0.6);
          pulseHaptic(this.leftController, 0.2, 10);
          this.labLog("[IMPACT] Hit Tree Trunk. Arrow stopped.");
          this.triggerSoundEvent(arrow.mesh.position, 15.0);
          break;
        }
      }
      if (hitTrunk) continue;

      let hitTarget = null;
      let minDistance = Infinity;

      this.targets.forEach(t => {
        const intersects = this._raycaster.intersectObject(t.mesh);
        if (intersects.length > 0 && intersects[0].distance < minDistance) {
          hitTarget = { mesh: t.mesh, point: intersects[0].point, armor: t.armor, faceNormal: t.faceNormal };
          minDistance = intersects[0].distance;
        }
      });

      if (hitTarget) {
        const currentKE = 0.5 * this.ARROW_MASS * arrow.velocity.lengthSq();

        if (currentKE >= hitTarget.armor) {
            arrow.active = false;
            playSound(thwackBuffer, 1.0);
            pulseHaptic(this.leftController, 0.3, 20);

            const embedMeters = Math.min(0.4, (currentKE - hitTarget.armor) * 0.001 + 0.05);
            arrow.mesh.position.copy(hitTarget.point).addScaledVector(flightDir, embedMeters);
            hitTarget.mesh.attach(arrow.mesh);
            this.labLog(`[IMPACT] STICK: KE ${currentKE.toFixed(0)}J > Armor ${hitTarget.armor}J`);
            this.triggerSoundEvent(hitTarget.point, 5.0);
        } else {
            playSound(bounceBuffer, 1.0);
            pulseHaptic(this.leftController, 0.5, 30);

            // [FIX #5] Proper surface-normal reflection: v' = v - 2(v·n)n * restitution
            const normal = this._tmpVec3A.copy(hitTarget.faceNormal);
            // Transform face normal to world space using the target mesh's world quaternion
            hitTarget.mesh.getWorldQuaternion(this._tmpQuat);
            normal.applyQuaternion(this._tmpQuat);

            const dot = arrow.velocity.dot(normal);
            const restitution = 0.3;
            arrow.velocity.addScaledVector(normal, -2 * dot * restitution);
            // Add small random scatter for realism
            arrow.velocity.x += (Math.random() - 0.5) * 2;
            arrow.velocity.y += (Math.random() - 0.5) * 2;

            this.labLog(`[IMPACT] BOUNCE: KE ${currentKE.toFixed(0)}J < Armor ${hitTarget.armor}J`);
            this.triggerSoundEvent(hitTarget.point, 20.0);
        }
      }
    }
  }

  _ensureControllerModels() {
    const renderer = xb.core?.renderer;
    if (!renderer || !renderer.xr) return;
    for (let i = 0; i < 2; i++) {
      if (this._gripsAdded[i]) continue;
      const grip = renderer.xr.getControllerGrip(i);
      if (!grip) continue;
      const model = this._controllerModelFactory.createControllerModel(grip);
      grip.add(model);
      this.add(grip);
      this._gripsAdded[i] = true;
    }
  }

  // Position the quiver per frame for shoulder mode. Bow- and hip-mounted
  // modes are static (or parented to bow which already follows the controller).
  _updateQuiverPosition() {
    if (!this.quiverGroup || this.QUIVER_MODE !== 'shoulder') return;
    const cam = xb.core?.camera
      || (xb.core?.renderer?.xr?.isPresenting ? xb.core.renderer.xr.getCamera() : null);
    if (!cam) return;
    const camPos = this._tmpVec3A.setFromMatrixPosition(cam.matrixWorld);
    if (camPos.y < 0.5) return;  // pose not yet settled
    const camQuat = cam.getWorldQuaternion(this._tmpQuat);
    const yaw = new THREE.Euler().setFromQuaternion(camQuat, 'YXZ').y;
    const yawQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0));
    // Over the right shoulder: right of head, slightly above shoulder
    // (just below head height), and behind so the rim sits at the back.
    const offset = this._tmpVec3B.set(0.22, -0.10, 0.18).applyQuaternion(yawQuat);
    this.quiverGroup.position.copy(camPos).add(offset);
    this.quiverGroup.quaternion.copy(yawQuat);
  }

  update() {
    const dt = xb.getDeltaTime();
    this._ensureControllerModels();
    this._updateQuiverPosition();

    // Detect AR/VR mode change at runtime
    const renderer = xb.core?.renderer;
    if (renderer && renderer.xr && renderer.xr.isPresenting) {
      const session = renderer.xr.getSession();
      if (session) {
        const isAR = (session.environmentBlendMode === 'alpha-blend' ||
                      session.environmentBlendMode === 'additive' ||
                      window.xrMode === 'immersive-ar');
        if (this._currentXRMode !== isAR) {
          this._currentXRMode = isAR;
          this.applyXRMode(isAR);
        }
      }
    }

    if (!this.bowAttached && xb.core.input.controllers.length > 0) {
      const ctrl = xb.core.input.controllers[0];
      ctrl.add(this.bowGroup);
      this.bowGroup.position.set(0, 0, -0.05);
      this.bowGroup.rotation.set(0, 0, 0);
      this.leftController = ctrl;
      this.bowAttached = true;
    }

    // Pointer ray follows whichever controller isn't holding the bow.
    if (this.pointerRay) {
      let pointerCtrl = null;
      for (const c of xb.core.input.controllers) {
        if (c !== this.leftController) { pointerCtrl = c; break; }
      }
      if (pointerCtrl && !this.isDrawing) {
        if (this.pointerRay.parent !== pointerCtrl) pointerCtrl.add(this.pointerRay);
        this.pointerRay.visible = true;
      } else {
        this.pointerRay.visible = false;
      }
    }

    // [FIX #15] Animal state machine with flee timer + return
    this.animals.forEach(a => {
        if (a.state === 'FLEE') {
            a.fleeTimer += dt;
            a.group.position.addScaledVector(a.velocity, dt);
            a.group.lookAt(a.group.position.clone().add(a.velocity));
            a.group.position.y = Math.abs(Math.sin(a.fleeTimer * 10)) * 0.4; // Use timer, not performance.now

            // Decelerate over time
            a.velocity.multiplyScalar(1 - dt * 0.5);

            // After 6 seconds, transition to RETURNING
            if (a.fleeTimer > 6.0) {
              a.state = 'RETURNING';
              a.label.text = "Returning...";
              a.label.color = 0xfbbf24;
            }
        } else if (a.state === 'RETURNING') {
            // Walk back toward origin
            const toOrigin = this._tmpVec3A.copy(a.origin).sub(a.group.position);
            const dist = toOrigin.length();
            if (dist < 0.3) {
              a.state = 'IDLE';
              a.group.position.copy(a.origin);
              a.label.text = "Prey";
              a.label.color = 0x4ade80;
            } else {
              toOrigin.normalize().multiplyScalar(2.0); // Walk speed
              a.group.position.addScaledVector(toOrigin, dt);
              a.group.lookAt(a.origin);
              a.group.position.y = 0;
            }
        }
    });

    this.updateArrows(dt);

    // [FIX #4] Batch Troika text sync — once per frame max
    if (this._consoleDirty) {
      this.consoleTextMesh.text = this.logs.join('\n');
      this.consoleTextMesh.sync();
      this._consoleDirty = false;
    }
  }
}

document.addEventListener('DOMContentLoaded', async function () {
  const options = new xb.Options();
  options.setAppTitle('Survival Physics Lab');
  options.enableXRTransitions();

  options.xrButton = {
    ...options.xrButton,
    startText: '<i id="xrlogo"></i> ENTER SURVIVAL LAB',
  };

  // Check AR support and hide toggle if not available
  if (navigator.xr) {
    try {
      const arSupported = await navigator.xr.isSessionSupported('immersive-ar');
      if (!arSupported) {
        document.getElementById('btn-ar').style.display = 'none';
        document.getElementById('mode-label').textContent = 'AR not supported on this device';
      }
    } catch(e) {
      document.getElementById('btn-ar').style.display = 'none';
    }
  }

  xb.add(new SurvivalLab());
  await xb.init(options);
});
    </script>
  </body>
